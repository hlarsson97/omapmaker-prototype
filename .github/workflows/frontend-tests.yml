name: Frontend tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check module syntax
        shell: bash
        run: |
          node --check app.mjs
          for file in js/*.mjs; do
            node --check "$file"
          done

      - name: Test frontend modules
        run: node tools/test_frontend_modules.mjs

      - name: Test ISOM renderer
        run: node tools/test_isom_renderer.js
